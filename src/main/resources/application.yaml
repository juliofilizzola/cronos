spring:
  application:
    name: cronos
  datasource:
    url: jdbc:postgresql://localhost:5432/cronos
    username: cronos
    password: cronos
  task:
    scheduling:
      pool:
        # scheduler, poll do worker, heartbeat, cancelamento e reaper não devem esperar um pelo outro
        size: 6

cronos:
  scheduler:
    batch-size: 100
    poll-interval-ms: 1000
  worker:
    enabled: true
    concurrency: 16
    poll-interval-ms: 500
    lease: 30s
    heartbeat-interval-ms: 10000
    cancel-check-interval-ms: 1000
    reaper-interval-ms: 5000
    backoff-base: 1s
    backoff-max: 5m
    shutdown-grace: 30s
  security:
    enabled: true
    api-keys: ${CRONOS_API_KEYS:}
    public-paths:
      - /actuator/health
  webhook:
    allow-private-networks: false
    allowed-hosts: []
    allowed-ports: []
  retention:
    enabled: true
    executions-max-age: 30d
    interval-ms: 3600000
    batch-size: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus